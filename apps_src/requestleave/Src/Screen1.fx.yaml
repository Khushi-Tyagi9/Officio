        X: =Parent.Width - Self.Width - 120
        Y: =Parent.Height - Self.Height - 120
        ZIndex: =1

    IconHeaderCreateNew_1 As icon.Add:
        AccessibleLabel: ="Create new leave request"
        Color: =Color.White
        DisabledFill: =IconHeaderCreateNew_1.Fill
        FocusedBorderColor: =IconHeaderCreateNew_1.BorderColor
        Height: =80
        HoverBorderColor: =ColorFade(IconHeaderCreateNew_1.BorderColor, 20%)
        HoverColor: =ColorFade(IconHeaderCreateNew_1.Color, 20%)
        HoverFill: =IconHeaderCreateNew_1.Fill
        Icon: =Icon.Add
        OnSelect: |
            =//used to know what text to show on controls if new request vs existing request
            Set(_requestType, "New");
            //used to know if reason you got to a screen was because editing existing request vs part of wizard
            Set(_sourceScreen,"Step");
            
            //reinitialise all variables set during wizard
            Set(_requestedDays,0);
            ClearCollect(ColTmpLeaveRequest,{ID:GUID(""),PersalNumber:"",Details:"",ApprovalStatus:ApprovalStatus.Draft,LeaveType:_defaultLeaveType,StartDate:_leaveStart,EndDate:_leaveEnd,Duration:0,ApproverEmail:"",ApproverID:"",SingleDayDuration:Blank()});
            
            Reset(LeaveEndDatePicker);
            Reset(LeaveStartDatePicker);
            Reset(txtPersalNumber);
            Reset(txtLeaveDetails);
            Reset(drpDayPeriod);
            Reset(GalleryLeaveRequestType);
            Reset(attachDocument);
            Navigate(LeaveTypeScreen, BorderStyle.None)
        PaddingBottom: =5
        PaddingLeft: =5
        PaddingRight: =5
        PaddingTop: =5
        PressedBorderColor: =ColorFade(IconHeaderCreateNew_1.BorderColor, -20%)
        PressedColor: =ColorFade(IconHeaderCreateNew_1.Color, -20%)
        PressedFill: =IconHeaderCreateNew_1.Fill
        TabIndex: =
        Width: =80
        X: =Parent.Width - Self.Width - 120
        Y: =Parent.Height - Self.Height - 120
        ZIndex: =2


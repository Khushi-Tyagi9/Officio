LeaveJustificationScreen As screen:
    Fill: |-
        =ColorValue("#FAF9F8")
    OnHidden: =
    OnVisible: |
        =//if for this leave type you need to suppy doc for more than X consective days, check for previous leave that ends the day before today
        //where sick not was not provided
        //todo: this says leave ends day before start of this leave, however, you need to then check totaldays between that leave request + this leave request exeeds
        //logic 
        // 1 - if leave type requires support file, then show/require file upload
        //2 - if require where total days taken is more than required amount, then show/require file upload
        //3 - if you need to look back in time, then look based on approved/pending leave requests where file was not uploaded, select top 1 only i.e. last item of same leave type as current leave type!
        //reset variables
        Set(
            varConsecutiveLeave,
            0
        );
        Set(
            varRequireUploadDoc,
            false
        );
        Set(x,0);
        Set(varTmpLeaveRequests,Blank());
        //1 - if fileupload required, then set it to required
        If(
            First(ColTmpLeaveRequest).LeaveType.'Require Supporting Document',
            Set(
                varRequireUploadDoc,
                true
            );
            Set(
                varUploadMessage,
                "For " & First(ColTmpLeaveRequest).LeaveType.Name & " leave type you must upload a supporting file e.g. note"
            )
        );
        //2 - if more days taken than min required for supporting docs
        If(
            First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days' > 0 && !varRequireUploadDoc,
            If(
                First(ColTmpLeaveRequest).Duration >= First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days',
                Set(
                    varRequireUploadDoc,
                    true
                );
                Set(
                    varUploadMessage,
                    "For " & First(ColTmpLeaveRequest).LeaveType.Name & " you are taking " & First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days' & " or more days, so supporting document is required e.g. note"
                )
            )
        );
        //3 - look back X amount of days and see if there is Y amount of days, which then require you to add evidence
        //filter to return records which have a start date of 'Require Support Doc in Past Days' in the past (not going to get too complicated on stuff like end date here)
        // and where leavetype is same as current leave type
        // then sum all the days taken in this peripd, and if its larger number than 'Require Supporting Doc Days', then you must upload supportimng doc
        If(
            First(ColTmpLeaveRequest).LeaveType.'Require Support Doc in Past Days' > 0 && First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days' > 0 && !varRequireUploadDoc,
            With(
                {
                    startTime: DateAdd(
                        First(ColTmpLeaveRequest).StartDate,
                        -First(ColTmpLeaveRequest).LeaveType.'Require Support Doc in Past Days',
                        TimeUnit.Days
                    ) + Time(
                        0,
                        -TimeZoneOffset(),
                        0
                    ),
                    endTime: First(ColTmpLeaveRequest).StartDate + Time(
                        0,
                        -TimeZoneOffset(),
                        0
                    )
                },
                Set(
                    varTmpLeaveRequests,
                    Filter(
                        'Leave Requests',
                        Employee.Id = GUID(_myProfile.Id) && ('Start Date' >= startTime && 'End Date' <= endTime) && ('Approval Status' <> "Declined" || 'Approval Status' <> "Cancelled") && 'Leave Type'.'Leave Type' = First(ColTmpLeaveRequest).LeaveType.'Leave Type'
                    )
                );
                Set(
                    x,
                    Sum(
                        varTmpLeaveRequests,
                        Duration
                    )
                )
            );
            If(
                x + First(ColTmpLeaveRequest).Duration >= First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days', Set(
                    varRequireUploadDoc,
                    true
                );
                Set(
                    varUploadMessage,
                    "For " & First(ColTmpLeaveRequest).LeaveType.Name & " you are taking " & First(ColTmpLeaveRequest).LeaveType.'Require Supporting Doc Days' & " or more days, over the past " & First(ColTmpLeaveRequest).LeaveType.'Require Support Doc in Past Days' & " days, so you need to upload a supporting document"
                )
            )
        );
    Orientation: =If(LeaveJustificationScreen.Width < LeaveJustificationScreen.Height, Layout.Vertical, Layout.Horizontal)
    Size: =1 + CountRows(App.SizeBreakpoints) - CountIf(App.SizeBreakpoints, Value >= LeaveJustificationScreen.Width)


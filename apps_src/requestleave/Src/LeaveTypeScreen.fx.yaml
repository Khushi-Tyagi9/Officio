LeaveTypeScreen As screen:
    Fill: |-
        =ColorValue("#FAF9F8")
    LoadingSpinner: =LoadingSpinner.Data
    OnHidden: =
    OnVisible: |-
        =//get all leave balances for current user and current year
        Set(colLeaveBalance,Filter('Leave Balances', Employee.Id = GUID(_myProfile.Id) && Year = Text(Year(Today()))))
    Orientation: =If(LeaveTypeScreen.Width < LeaveTypeScreen.Height, Layout.Vertical, Layout.Horizontal)
    Size: =1 + CountRows(App.SizeBreakpoints) - CountIf(App.SizeBreakpoints, Value >= LeaveTypeScreen.Width)

    ContainerMainH_1 As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        ZIndex: =48

        ContainerHeaderH_1 As groupContainer.horizontalAutoLayoutContainer:
            Fill: =varGlobals.MainThemeColor.Fill
            FillPortions: =0
            Height: =70
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =1

            Icon1 As icon.BackArrow:
                AlignInContainer: =AlignInContainer.Stretch
                Color: =Color.White
                Height: =60
                Icon: =Icon.BackArrow
                OnSelect: =Back();
                PaddingLeft: =10
                Width: =60
                X: =18
                Y: =6
                ZIndex: =1

            Label8 As label:
                Align: =LayoutAlignItems.Center
                Color: =RGBA(255, 255, 255, 1)
                FillPortions: =1
                FocusedBorderColor: =Label8.BorderColor
                Font: =varGlobals.Body.Font
                FontWeight: =FontWeight.Semibold
                Height: =70
                HoverBorderColor: =Label8.BorderColor
                HoverColor: =Label8.Color
                HoverFill: =Label8.Fill
                PressedBorderColor: =Label8.BorderColor
                PressedColor: =Label8.Color
                PressedFill: =Label8.Fill
                Size: =If(LeaveTypeScreen.Size = 1,varGlobals.Header.FontSize-4,varGlobals.Header.FontSize)
                Text: =_requestType & " request"
                Width: =1366
                ZIndex: =2

        Container6 As groupContainer.verticalAutoLayoutContainer:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =15
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            ZIndex: =2

            ContainerLeaveTypeOptions As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =If(TglSpecialType.X  <200,100,50)
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutMinHeight: =100
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                LayoutWrap: =true
                ZIndex: =1

                TypeRequestTitle_3 As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(255, 37, 0, 0)
                    Color: =varGlobals.Body.FontColor
                    FillPortions: =1
                    FocusedBorderColor: =TypeRequestTitle_3.BorderColor
                    Font: =varGlobals.Body.Font
                    FontWeight: =FontWeight.Bold
                    Height: =19
                    HoverBorderColor: =TypeRequestTitle_3.BorderColor
                    HoverColor: =TypeRequestTitle_3.Color
                    HoverFill: =TypeRequestTitle_3.Fill
                    LayoutMinWidth: =300
                    LineHeight: =1
                    PaddingBottom: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    PressedBorderColor: =TypeRequestTitle_3.BorderColor
                    PressedColor: =TypeRequestTitle_3.Color
                    PressedFill: =TypeRequestTitle_3.Fill
                    Size: =varGlobals.Body.FontSize
                    Text: |-
                        ="Select the type of leave you plan to take:"
                    Width: =1085
                    X: =20
                    Y: =90
                    ZIndex: =1

                TglSpecialType As toggleSwitch:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =varGlobals.Body.FontColor
                    Default: =true
                    FalseFill: =varGlobals.BlueRobot.Fill
                    FalseText: ="hide special leave types"
                    Font: =varGlobals.Body.Font
                    FontWeight: =FontWeight.Semibold
                    Height: =30
                    Size: =varGlobals.Body.FontSize
                    TextPosition: =TextPosition.Left
                    TrueFill: =varGlobals.BlueRobot.Fill
                    TrueText: ="show special leave types"
                    Width: =270
                    ZIndex: =2

                Rectangle3 As rectangle:
                    AlignInContainer: =AlignInContainer.Stretch
                    Fill: =RGBA(0, 0, 0, 0)
                    LayoutMinHeight: =50
                    Width: =20
                    ZIndex: =3

            GalleryLeaveRequestType As gallery.galleryVertical:
                BorderColor: =RGBA(255,255,255,1)
                BorderThickness: =1
                Default: |
                    =If(_requestType = "New",{},First(ColTmpLeaveRequest).LeaveType)
                DisabledBorderColor: =GalleryLeaveRequestType.BorderColor
                DisabledFill: =GalleryLeaveRequestType.Fill
                Height: =537
                HoverBorderColor: =GalleryLeaveRequestType.BorderColor
                HoverFill: =GalleryLeaveRequestType.Fill
                Items: |-
                    =//Filter('Leave Balances', Employee.'AAD user id' = GUID(_myProfile.Id) && Year = Text(Year(Today())) && 'Visible To Employee' = 'Visible To Employee (Leave Balances)'.Yes)
                    Switch(TglSpecialType.Value,true,
                    Filter('Leave Types','Employee Selectable' = 'Employee Selectable (Leave Types)'.Yes && 'Special Type' = 'Special Type (Leave Types)'.No),Filter('Leave Types','Employee Selectable' = 'Employee Selectable (Leave Types)'.Yes))
                Layout: =Layout.Vertical
                LayoutMinHeight: =300
                LayoutMinWidth: =320
                LoadingSpinnerColor: =GalleryLeaveRequestType.BorderColor
                OnSelect: =//Set(varTmpLeaveType, ThisItem)
                PressedBorderColor: =GalleryLeaveRequestType.BorderColor
                PressedFill: =GalleryLeaveRequestType.Fill
                ShowScrollbar: =false
                TemplatePadding: =If(LeaveTypeScreen.Size = 1,2,15)
                TemplateSize: =180
                Transition: =Transition.Pop
                Width: =694
                WrapCount: =LeaveTypeScreen.Size
                Y: =120
                ZIndex: =3

                Container5 As groupContainer.manualLayoutContainer:
                    Height: =Parent.TemplateHeight
                    Width: =Parent.TemplateWidth
                    ZIndex: =14

                    Rectangle6_3 As rectangle:

                        PressedColor: =Label17_8.Color
                        PressedFill: =Label17_8.Fill
                        Size: =varGlobals.Navigation.FontSize
                        Text: |-
                            =With(
                                LookUp(
                                    colLeaveBalance,
                                    'Leave Type'.'Leave Type' = ThisItem.'Leave Type'
                                ),
                                Text('Leave Taken') & Switch(
                                    Abs('Leave Taken'),
                                    Blank(),
                                    "0 days taken",
                                    1,

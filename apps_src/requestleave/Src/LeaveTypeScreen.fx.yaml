        Container8 As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =80
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =5
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =5
            ZIndex: =3

            btnSubmitRequest As button:
                Align: =LayoutAlignItems.Center
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(0,0,0,1)
                BorderThickness: =0
                Color: =Color.White
                DisabledBorderColor: =ColorFade(btnSubmitRequest.BorderColor, 70%)
                DisplayMode: =If(IsBlank(GalleryLeaveRequestType.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                Fill: =varGlobals.BlueRobot.Fill
                FillPortions: =1
                FocusedBorderColor: =btnSubmitRequest.BorderColor
                Font: =varGlobals.Body.Font
                Height: =80
                HoverBorderColor: =ColorFade(btnSubmitRequest.BorderColor, 20%)
                HoverColor: =btnSubmitRequest.Color
                HoverFill: =ColorFade(btnSubmitRequest.Fill, 20%)
                OnSelect: |
                    =Patch(ColTmpLeaveRequest,First(ColTmpLeaveRequest),{LeaveType:GalleryLeaveRequestType.Selected});
                    
                    If(
                        _sourceScreen = "Review",
                        Navigate(LeaveReviewScreen),
                        Set(
                            _sourceScreen,
                            "Step"
                        );
                        Navigate(
                            LeaveDatesScreen,
                            ScreenTransition.None
                        )
                    );
                PressedBorderColor: =btnSubmitRequest.Fill
                PressedColor: =btnSubmitRequest.Fill
                PressedFill: =btnSubmitRequest.Color
                Size: =varGlobals.Navigation.FontSize
                Text: =If(_sourceScreen = "Review","Save","Next")
                Width: =Parent.Width
                Y: =688
                ZIndex: =1


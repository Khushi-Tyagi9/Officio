                            //ThisItem.'Leave Taken' & " day(s) taken"
                        Width: =240
                        X: =20
                        Y: =55
                        ZIndex: =4

                    Label17_9 As label:
                        Color: =varGlobals.Body.FontColor
                        FocusedBorderColor: =Label17_9.BorderColor
                        FocusedBorderThickness: =2
                        Font: =Font.Lato
                        FontWeight: =FontWeight.Semibold
                        Height: =30

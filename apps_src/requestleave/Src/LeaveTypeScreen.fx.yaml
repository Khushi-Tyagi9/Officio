                        Size: =varGlobals.Navigation.FontSize
                        Text: |-
                            =//if delegation warning here, its okay because colLeaveBalance will never have more than 2 records
                            With(
                                LookUp(
                                    colLeaveBalance,
                                    'Leave Type'.'Leave Type' = ThisItem.'Leave Type'
                                ),
                                Text('Current Balance') & Switch(
                                    Abs('Current Balance'),
                                    Blank(),
                                    "0 days available",
                                    1,
                                    " day available",
                                    " days available"
                                )
                            )
                            
                            //Text(ThisItem.'Current Balance') & If(Abs(ThisItem.'Current Balance')=1, " day", " days") & " available"
                            //ThisItem.'Leave Taken' & " day(s) taken"
                        Visible: =ThisItem.'Has Balance'
                        Width: =240
                        X: =20
                        Y: =92
                        ZIndex: =5

                    Label18_6 As label:
                        Color: =varGlobals.Body.FontColor

MainScreen As screen:
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: =

    ContainerRoot As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        X: =0   
        ZIndex: =1

        ContainerMain As groupContainer.verticalAutoLayoutContainer:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            ZIndex: =1

            Label1 As label:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                Color: =RGBA(51, 51, 51, 1)
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(166, 166, 166, 1)
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                Size: =10.5
                Text: ="To " & Lower(varState) & " the leave request for " & varCurrentLeaveRequest.Employee.'Display Name' & ", add comments and select " & varState
                Width: =500
                ZIndex: =1

            Label1_1 As label:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                BorderThickness: =2
                Color: =RGBA(51, 51, 51, 1)
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(166, 166, 166, 1)
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                Size: =10.5
                Text: |-
                    ="Comments:"
                Width: =500
                ZIndex: =2

            txtApprovalComments As text:
                AlignInContainer: =AlignInContainer.Stretch
                BorderColor: =RGBA(166, 166, 166, 1)
                BorderThickness: =2
                Color: =RGBA(51, 51, 51, 1)
                Default: =""
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                FocusedBorderColor: =RGBA(0, 120, 212, 1)
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                Height: =200
                HintText: ="approve / reject comments"
                HoverBorderColor: =RGBA(166, 166, 166, 1)
                HoverColor: =RGBA(51, 51, 51, 1)
                HoverFill: =RGBA(212, 212, 212, 1)
                MaxLength: =2000
                Mode: =TextMode.MultiLine
                PressedBorderColor: =RGBA(0, 120, 212, 1)
                PressedColor: =RGBA(51, 51, 51, 1)
                PressedFill: =RGBA(212, 212, 212, 1)
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
                RadiusTopLeft: =0
                RadiusTopRight: =0
                Size: =10.5
                ZIndex: =3

        Container3 As groupContainer.verticalAutoLayoutContainer:
            LayoutAlignItems: =LayoutAlignItems.End
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =80
            PaddingLeft: =20
            PaddingRight: =20
            ZIndex: =2

            Button1 As button:
                BorderColor: =RGBA(0, 0, 0, 0)
                BorderStyle: =BorderStyle.None
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: =If(IsBlank(txtApprovalComments.Text),DisplayMode.Disabled,DisplayMode.Edit)
                Fill: =RGBA(41,114,182,1)
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =35
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =RGBA(255, 255, 255, 1)
                HoverFill: =ColorFade(RGBA(0, 120, 212, 1), -10%)
                OnSelect: |-
                    =Switch(
                        varState,
                        "Approve",
                        Patch(
                            'Leave Requests',
                            varCurrentLeaveRequest,
                            {
                                'Approval Status': "Pending HR Capture",
                                'Last Actor': User().FullName,
                                'Last Actor Action': "Approved",
                                'Last Actor Comments': txtApprovalComments.Text,
                                'Last Actor Timestamp': Now()
                            }
                        ),
                        "Decline",
                        Patch(
                            'Leave Requests',
                            varCurrentLeaveRequest,
                            {
                                'Approval Status': "Declined",
                                'Last Actor': User().FullName,
                                'Last Actor Action': "Declined",
                                'Last Actor Comments': txtApprovalComments.Text,
                                'Last Actor Timestamp': Now()
                            }
                        )
                    );
                    Back()
                PressedBorderColor: =ColorFade(RGBA(0, 120, 212, 1), -50%)
                PressedColor: =RGBA(255, 255, 255, 1)
                PressedFill: =ColorFade(RGBA(0, 120, 212, 1), -30%)
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
                RadiusTopLeft: =0
                RadiusTopRight: =0
                Size: =10.5
                Text: =varState
                ZIndex: =1

            Label2 As Label:
                DisplayMode: =DisplayMode.Edit
                Height: =32
                LayoutMinHeight: =32
                LayoutMinWidth: =320
                Text: =""
                Width: =80
                Wrap: =false
                X: =0
                Y: =0
                ZIndex: =2

            Button2 As button:
                BorderColor: =RGBA(41,114,182,1)
                BorderStyle: =BorderStyle.None
                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =RGBA(41,114,182,1)
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =35
                HoverBorderColor: =RGBA(0, 0, 0, 0)
                HoverColor: =RGBA(255, 255, 255, 1)
                HoverFill: =ColorFade(RGBA(0, 120, 212, 1), -10%)
                OnSelect: |
                    =Back()
                PressedBorderColor: =ColorFade(RGBA(0, 120, 212, 1), -50%)
                PressedColor: =RGBA(255, 255, 255, 1)
                PressedFill: =ColorFade(RGBA(0, 120, 212, 1), -30%)
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
                RadiusTopLeft: =0
                RadiusTopRight: =0
                Size: =10.5
                Text: ="Cancel"
                ZIndex: =3


App As appinfo:
    BackEnabled: =false
    OnStart: |-
        =
            If(
                IsBlank(Param("recordId")),
                Set(varRecordId, "C8E42C53-4E9D-ED11-AAD1-000D3A25B1BB");
        Set(varState,"Approve")
                ,
                
        Set(varRecordId,
                Substitute(
                    Substitute(
                        First(Split(Param("recordId"),":")).Result,
                        "}",
                        ""
                    ),
                    "{",
                    ""
                )
            
        );
        Set(varState,
        Last(Split(Param("recordId"),":")).Result
            ));
        Set(
            varCurrentLeaveRequest,
            LookUp(
                'Leave Requests',
                'Leave Request' = GUID(varRecordId)
            )
        )

